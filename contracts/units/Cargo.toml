[package]
name = "bandsheet-units"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Bandsheet units: anyone with a NEAR wallet starts their own unit (council, members, releases) on one contract."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "~5.27", features = ["unstable"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "~5.27", features = ["unstable", "unit-testing"] }

# Its own workspace: the judged bandsheet crate and its Cargo files stay untouched.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
