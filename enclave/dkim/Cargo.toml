[package]
name = "bandsheet-dkim"
version = "0.1.0"
edition = "2021"
description = "DKIM (RFC 6376, rsa-sha256) verification and payslip parsing for the Bandsheet enclave. Pure, no I/O, no DNS: the trusted key is supplied by the caller."
publish = false

[dependencies]
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hex = "0.4"

[dev-dependencies]
serde_json = "1.0"
