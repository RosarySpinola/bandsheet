[package]
name = "bandsheet-audit"
version = "0.1.0"
edition = "2021"
description = "Release audit for Bandsheet: pure, no I/O. Every released cell is a sum query over member slots; a release is refused when some individual (or a group smaller than k) becomes solvable from everything released so far."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
